<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>{{{ PRODUCT_NAME }}}</title>
  <!-- Yandex Games SDK -->
  <script src="/sdk.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b2a3a;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; overscroll-behavior: none; position: fixed; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #1b2a3a; outline: none; }
    #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: Arial, sans-serif; color: #fff; background: linear-gradient(#3aa0ff, #1b5fa8); }
    #loader h1 { font-size: 34px; margin: 0 0 24px; text-shadow: 0 3px 0 #0b3a6e; letter-spacing: 1px; }
    #bar { width: 60%; max-width: 420px; height: 22px; border: 3px solid #0b3a6e; border-radius: 12px; background: #0b3a6e; overflow: hidden; }
    #fill { width: 0%; height: 100%; background: #56e05a; transition: width .15s; }
  </style>
</head>
<body oncontextmenu="return false;">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader"><h1 id="loader-title">{{{ PRODUCT_NAME }}}</h1><div id="bar"><div id="fill"></div></div></div>
  <script>
    window.ysdk = null;
    window.yplayer = null;
    window.unityInstance = null;
    window.ygApiPaused = false;

    function ygSend(method, arg) {
      if (window.unityInstance) window.unityInstance.SendMessage("YandexSDK", method, arg || "");
    }

    // Отложенные вызовы из Unity (YandexBridge.jslib): LoadingAPI.ready() и GameplayAPI.start/stop,
    // если Unity дошла до них раньше, чем завершился YaGames.init().
    window.ygFlushPending = function () {
      var sdk = window.ysdk;
      if (!sdk || !sdk.features) return;
      try {
        if (window.ygReadyPending && !window.ygReadySent && sdk.features.LoadingAPI) {
          window.ygReadySent = true;
          sdk.features.LoadingAPI.ready();
        }
        if (window.ygReadySent) window.ygApplyBanner();
        // разметку геймплея шлём только после ready()
        if (window.ygReadySent && window.ygGameplayPending && sdk.features.GameplayAPI) {
          var g = window.ygGameplayPending;
          window.ygGameplayPending = null;
          if (g === "start") sdk.features.GameplayAPI.start(); else sdk.features.GameplayAPI.stop();
        }
      } catch (e) { console.warn(e); }
    };

    // Sticky-баннер: приводим фактическое состояние к желаемому (window.ygBannerWanted из Unity).
    // Баннер платформа рисует вне области игры (iframe ужимается), поэтому HUD он не перекрывает.
    window.ygBannerWanted = false;
    var bannerBusy = false, bannerShown = false, bannerRetry = 0, bannerTimer = null, bannerOff = false;
    function bannerSchedule(ms) {
      if (bannerTimer) clearTimeout(bannerTimer);
      bannerTimer = setTimeout(function () { bannerTimer = null; window.ygApplyBanner(); }, ms);
    }
    window.ygApplyBanner = function () {
      var sdk = window.ysdk;
      if (!sdk || !sdk.adv || !window.ygReadySent || bannerBusy || bannerOff) return;
      var want = !!window.ygBannerWanted;
      if (!want) {
        if (typeof sdk.adv.hideBannerAdv !== "function") return;
        bannerBusy = true;
        // проверяем реальный статус (баннер мог быть показан платформой), прячем только если он виден
        var hs = typeof sdk.adv.getBannerAdvStatus === "function"
          ? Promise.resolve(sdk.adv.getBannerAdvStatus()) : Promise.resolve({ stickyAdvIsShowing: bannerShown });
        hs.then(function (st) {
          if (st && !st.stickyAdvIsShowing) return st;
          return sdk.adv.hideBannerAdv();
        }).then(function (r) {
          bannerShown = !!(r && r.stickyAdvIsShowing);
        }).catch(function (e) { console.warn("hideBannerAdv", e); }).then(function () {
          bannerBusy = false;
          if (window.ygBannerWanted !== want || bannerShown) bannerSchedule(bannerShown ? 3000 : 0);
        });
        return;
      }
      if (typeof sdk.adv.showBannerAdv !== "function") return;
      bannerBusy = true;
      var status = typeof sdk.adv.getBannerAdvStatus === "function"
        ? Promise.resolve(sdk.adv.getBannerAdvStatus()) : Promise.resolve({ stickyAdvIsShowing: bannerShown });
      status.then(function (st) {
        if (st && st.stickyAdvIsShowing) return st;
        if (st && st.reason === "ADV_IS_NOT_CONNECTED") return st;
        return sdk.adv.showBannerAdv();
      }).then(function (r) {
        bannerShown = !!(r && r.stickyAdvIsShowing);
        if (!bannerShown && r && r.reason === "ADV_IS_NOT_CONNECTED") {
          bannerOff = true; // баннеры не включены в консоли — больше не пытаемся
          console.warn("Sticky banners are not enabled in the Yandex Games console");
        }
      }).catch(function (e) { console.warn("showBannerAdv", e); bannerShown = false; }).then(function () {
        bannerBusy = false;
        if (window.ygBannerWanted !== want) { bannerSchedule(0); return; }
        // баннер ещё не готов / ошибка на стороне Яндекса — повторяем (5 с, 10 с, ... до 60 с)
        if (want && !bannerShown && !bannerOff) { bannerRetry++; bannerSchedule(Math.min(60000, 5000 * bannerRetry)); }
        else bannerRetry = 0;
      });
    };

    // Заголовок экрана загрузки на языке портала (ru/be/kk/uk/uz — русский, иначе английский)
    function ygLoaderTitle(lang) {
      var ru = /^(ru|be|kk|uk|uz)/i.test(lang || "");
      var el = document.getElementById("loader-title");
      if (el) el.textContent = ru ? "Укради Дракона" : "Steal a Dragon";
    }
    ygLoaderTitle(navigator.language);

    function initYandex() {
      if (typeof YaGames === "undefined") { window.ysdkFailed = true; window.yplayerFailed = true; return; }
      YaGames.init().then(function (sdk) {
        window.ysdk = sdk;
        try { ygLoaderTitle(sdk.environment.i18n.lang); } catch (e) { }
        // Пауза/возобновление от платформы: реклама при запуске (без колбэков), диалог покупки, смена вкладки.
        // Платформа сама вызывает GameplayAPI.stop()/start(); игра глушит звук и ставит паузу.
        if (typeof sdk.on === "function") {
          sdk.on("game_api_pause", function () { window.ygApiPaused = true; ygSend("OnGameApiPause"); });
          sdk.on("game_api_resume", function () { window.ygApiPaused = false; ygSend("OnGameApiResume"); });
        }
        window.ygFlushPending();
        sdk.getPlayer({ scopes: false }).then(function (p) { window.yplayer = p; })
          .catch(function () { window.yplayerFailed = true; });
      }).catch(function (e) { console.warn("YaGames init failed", e); window.ysdkFailed = true; window.yplayerFailed = true; });
    }
    initYandex();

    document.addEventListener("visibilitychange", function () {
      ygSend("OnVisibility", document.hidden ? "0" : "1");
    });

    // Без контекстного меню, выделения, скролла/зума страницы (длинный тап, колесо, пинч, пробел/стрелки)
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    document.addEventListener("selectstart", function (e) { e.preventDefault(); });
    document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("touchstart", function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    document.addEventListener("dblclick", function (e) { e.preventDefault(); });
    window.addEventListener("wheel", function (e) { e.preventDefault(); }, { passive: false });
    window.addEventListener("keydown", function (e) {
      if ([32, 33, 34, 35, 36, 37, 38, 39, 40].indexOf(e.keyCode) >= 0) e.preventDefault();
    });

    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 1.25 : 2)
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function (instance) {
        window.unityInstance = instance;
        document.querySelector("#loader").style.display = "none";
        // события, пришедшие до старта Unity (реклама при запуске, скрытая вкладка)
        if (window.ygApiPaused) ygSend("OnGameApiPause");
        if (document.hidden) ygSend("OnVisibility", "0");
        canvas.focus();
      }).catch(function (message) { console.error(message); });
    };
    document.body.appendChild(script);
    window.addEventListener("pointerdown", function () { canvas.focus(); });
  </script>
</body>
</html>
