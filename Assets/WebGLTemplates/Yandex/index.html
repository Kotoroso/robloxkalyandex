<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>{{{ PRODUCT_NAME }}}</title>
  <!-- Yandex Games SDK -->
  <script src="/sdk.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b2a3a;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #1b2a3a; outline: none; }
    #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: Arial, sans-serif; color: #fff; background: linear-gradient(#3aa0ff, #1b5fa8); }
    #loader h1 { font-size: 34px; margin: 0 0 24px; text-shadow: 0 3px 0 #0b3a6e; letter-spacing: 1px; }
    #bar { width: 60%; max-width: 420px; height: 22px; border: 3px solid #0b3a6e; border-radius: 12px; background: #0b3a6e; overflow: hidden; }
    #fill { width: 0%; height: 100%; background: #56e05a; transition: width .15s; }
  </style>
</head>
<body oncontextmenu="return false;">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader"><h1>{{{ PRODUCT_NAME }}}</h1><div id="bar"><div id="fill"></div></div></div>
  <script>
    window.ysdk = null;
    window.yplayer = null;
    window.unityInstance = null;

    function initYandex() {
      if (typeof YaGames === "undefined") { window.yplayerFailed = true; return; }
      YaGames.init().then(function (sdk) {
        window.ysdk = sdk;
        sdk.getPlayer({ scopes: false }).then(function (p) { window.yplayer = p; })
          .catch(function () { window.yplayerFailed = true; });
      }).catch(function (e) { console.warn("YaGames init failed", e); window.yplayerFailed = true; });
    }
    initYandex();

    document.addEventListener("visibilitychange", function () {
      if (window.unityInstance) window.unityInstance.SendMessage("YandexSDK", "OnVisibility", document.hidden ? "0" : "1");
    });

    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 1.25 : 2)
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function (instance) {
        window.unityInstance = instance;
        document.querySelector("#loader").style.display = "none";
        canvas.focus();
      }).catch(function (message) { alert(message); });
    };
    document.body.appendChild(script);
    window.addEventListener("pointerdown", function () { canvas.focus(); });
  </script>
</body>
</html>
